<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
         <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Study Buddy Finder</title>
        <link rel="stylesheet" href="css/login.css" type="text/css" />
        <link rel="icon" href="" type="image/x-icon" />
        <script type="text/javascript" src="js/auth.js"></script>
    </head>


    <body>
        <main class="app-screen">
            <form class="login-card" method="post">
                <div class="logo">
                    <img src="images/logo.png" alt="Avatar" class="avatar">
                </div>

                <h1>Study Buddy 📚</h1>
                <p class="tagline">Find your perfect study partner ✨</p>

                <div class="container">
                    <label for="name"><b>Full Name</b></label>
                    <input type="text" id="name" placeholder="John Doe" name="name" required>

                    <label for="email"><b>Email</b></label>
                    <input type="email" id="email" placeholder="john@university.edu" name="email" required>

                    <label for="password"><b>Password</b></label>
                    <input type="password" id="password" placeholder="••••••••" name="password" required>

                    <button type="submit">Continue 🚀</button>
                </div>
            </form>
        </main>
    </body>
</html>
